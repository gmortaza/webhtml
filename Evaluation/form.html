<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form method="post">
        <h2>Donor Information</h2>
        
            
            <table>
                 <tr>
                <td><label for="First Name">First Name*:</label></td>
                <td><input type="text" id="First Name" name="First Name" required></td>
            </tr>
            <tr>
                <td><label for="Last Name">Last Name*:</label></td>
                <td><input type="text" id="Last Name" name="Last Name" required></td>
            </tr>
             <tr>
                <td><label for="company">Company:</label></td>
                <td><input type="text" id="company" name="company"></td>
            </tr>
              <tr>
                <td><label for="company">Company:</label></td>
                <td><input type="text" id="company" name="company"></td>
            </tr>
            <tr>
                <td><label for="address1">Address 1*:</label></td>
                <td><input type="text" id="address1" name="address1" required></td>
            </tr>
            <tr>
                <td><label for="address2">Address 2:</label></td>
                <td><input type="text" id="address2" name="address2"></td>
            </tr>
            <tr>
                <td><label for="city">City*:</label></td>
                <td><input type="text" id="city" name="city"></td>
            </tr>
            <tr>
             <td><label for="state">State*:</label></td>
            <td>
                  <select id="state" name="state">
                  <option>Select a State</option>
                  <option>Alabama</option>
                  <option>California</option>
                  <option>New York</option>
                  <option>Texas</option>
                </select>
            </td>
            </tr>
            <tr>
                <td><label for="zip">Zip Code*:</label></td>
                <td><input type="text" id="zip" name="zip" required></td>
            </tr>

                <td><label for="country">Country*:</label></td>
                <td>
                    <select id="country" name="country">
                        <option>Select a Country</option>
                        <option>Bangladesh</option>
                        <option>India</option>
                        <option>UK</option>
                        <option>USA</option>
                    </select>
                </td>
             <tr>
                <td><label for="phone">Phone:</label></td>
                <td><input type="text" id="phone" name="phone"></td>
            </tr>
            <tr>
                <td><label for="fax">Fax:</label></td>
                <td><input type="text" id="fax" name="fax"></td>
            </tr>
            <tr>
                <td><label for="email">Email*:</label></td>
                <td><input type="email" id="email" name="email" required></td>
            </tr>
             <tr>
                <td><label>Donation Amount*:</label></td>
                <td>
                    <input type="radio" name="amount" value="none" checked>None
                    <input type="radio" name="amount" value="50">$50
                    <input type="radio" name="amount" value="75">$75
                    <input type="radio" name="amount" value="100">$100
                    <input type="radio" name="amount" value="250">$250
                    <input type="radio" name="amount" value="other">Other
                </td>
            </tr>
            <tr>
                <td><label for="other_amount">Other Amount:</label></td>
                <td><input type="text" id="other_amount" name="other_amount"></td>
            </tr>
              <tr>
                <td><label>Recurring Donation:</label></td>
                <td>
                    <input type="checkbox" name="recurring" value="yes">I am interested in giving on a regular basis.
                </td>
                 <tr>
                <td><label for="monthly">Monthly Credit Card $:</label></td>
                <td>
                    <input type="text" id="monthly" name="monthly" size="6">
                    For <input type="text" id="months" name="months" size="4"> Months
                </td>
            </tr>
            <tr>
                <td>
                    <td>
                        <input type="submit" value="Donate">
                        <input type ="reset">
                    </td>
                </td>
            </tr>    
        </table>
    </form>  
</body>
</html>
